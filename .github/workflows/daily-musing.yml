name: Autonomous Nightly Musing Generation

on:
  schedule:
    # Runs nightly at 19:30 UTC (03:30 SGT)
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale Mesh
        if: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Musing Synthesis & Housekeeping Script
        env:
          LM_STUDIO_URL: http://100.82.24.65:1234/v1
        run: python3 scripts/generate_musing.py

      - name: Commit and Push Updated Musings
        id: git_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/musingsData.ts src/data/musings.json
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(musings): autonomous nightly musing synthesis & housekeeping"
            git pull --rebase origin main || true
            git push origin main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Assets
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
